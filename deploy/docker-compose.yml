# Jumble web client — reachable by Caddy (container) as `jumble:8080` on the
# nitter-edge network; also published on 127.0.0.1:8080 for direct host access.
services:
  jumble:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: jumble
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - default
      - nitter-edge
    restart: unless-stopped

networks:
  nitter-edge:
    external: true
